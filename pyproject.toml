[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freehand"
version = "0.1.0"
description = "Head-tracking mouse control with dwell click (CustomTkinter + MediaPipe)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2",
  "opencv-python-headless>=4.8.0",
  "mediapipe>=0.10.9,<0.10.15",
  "numpy>=1.24.0",
  "PyAutoGUI>=0.9.54",
  "Pillow>=10.0.0",
]

[project.scripts]
freehand = "freehand.main:main"

[tool.setuptools.packages.find]
include = ["freehand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
